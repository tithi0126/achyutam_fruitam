name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Create App Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: mkdir -p /home/ubuntu/Public/apps/icecreamshop

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "dist"
          target: "/home/ubuntu/Public/apps/icecreamshop"
          rm: true

      - name: Start Application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            # Install pm2 and serve globally if they are not installed
            if ! command -v pm2 &> /dev/null; then
                echo "Installing pm2 and serve..."
                npm install -g pm2 serve
            fi
            
            # Check if serve is installed (it usually comes with pm2 serve support but let's be sure)
             if ! command -v serve &> /dev/null; then
                npm install -g serve
            fi

            # Open firewall port 5008
            if command -v ufw &> /dev/null; then
                echo "Allowing port 5008 in firewall..."
                ufw allow 5008/tcp
                ufw reload || true
            fi
            
            # Reload or Start application
            # Path will be /home/ubuntu/Public/apps/icecreamshop/dist because we copied 'dist' folder to 'icecreamshop'
            
            pm2 describe icecreamshop > /dev/null
            RUNNING=$?

            if [ "${RUNNING}" -ne 0 ]; then
              echo "Starting application with pm2..."
              pm2 serve /home/ubuntu/Public/apps/icecreamshop/dist 5008 --name "icecreamshop" --spa
            else
              echo "Restarting application..."
              pm2 restart icecreamshop
            fi
            
            pm2 save
